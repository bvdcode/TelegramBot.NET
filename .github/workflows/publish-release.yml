name: Action to build and publish the project as a nuget package to github package registry

on:
  push:
    branches:
      - main
    paths:
      - Sources/**
      - .github/workflows/publish-release.yml
      
jobs:
  build:
    runs-on: ubuntu-latest    
    outputs: 
      Version: ${{ steps.gitversion.outputs.SemVer }}
      CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }} 

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0 #fetch-depth is needed for GitVersion
        
    #Install and calculate the new version with GitVersion  
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.9.7
      with:
        versionSpec: 5.x
    - name: Determine Version
      uses: gittools/actions/gitversion/execute@v0.9.7
      id: gitversion # step id used as reference for output values
    - name: Display GitVersion outputs
      run: |
        echo "Version: ${{ steps.gitversion.outputs.SemVer }}"
        echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}"
    
    #Build/pack the project
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore
      run: dotnet restore Sources/TelegramBot.sln
    - name: Build
      run: dotnet build Sources/TelegramBot.sln --configuration Release --no-restore
    - name: Test
      run: dotnet test Sources/TelegramBot.sln --configuration Release --no-build --verbosity normal
    - name: Pack NuGet package
      run: |
          dotnet pack Sources/TelegramBot/TelegramBot.csproj --configuration Release --no-build --output Sources/TelegramBot/nupkg -p:Version='${{ steps.gitversion.outputs.SemVer }}' 
    - name: Upload NuGet package to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: nupkg
        path: Sources/TelegramBot/nupkg
        
  release:
    runs-on: ubuntu-latest    
    needs: build
    if: github.ref == 'refs/heads/main' # only run job if on the master branch   
    permissions:
      contents: read
      id-token: write
    
    steps:  
    #Push NuGet package to GitHub packages
    - name: Download nuget package artifact
      uses: actions/download-artifact@v4.0.0
      with:
        name: nupkg
    - name: Prep packages
      run: dotnet nuget add source --username bvdcode --password ${{ secrets.DEPLOY_GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/bvdcode/index.json"
    - name: Push package to GitHub packages 
      if: needs.build.outputs.CommitsSinceVersionSource > 0 #Only release if there has been a commit/version change  
      run: |
        dotnet nuget push *.nupkg --skip-duplicate --api-key ${{ secrets.DEPLOY_GITHUB_TOKEN }} --source "github"
    - name: Sign in to NuGet.org
      if: needs.build.outputs.CommitsSinceVersionSource > 0
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: nuget
      with:
        user: ${{ vars.NUGET_USER }}
    - name: Push package to NuGet.org
      if: needs.build.outputs.CommitsSinceVersionSource > 0
      env:
        NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
      run: dotnet nuget push *.nupkg --skip-duplicate --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

    - name: Create Release
      if: needs.build.outputs.CommitsSinceVersionSource > 0 #Only release if there has been a commit/version change
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ needs.build.outputs.Version }}
        name: Release ${{ needs.build.outputs.Version }}
        artifacts: "nupkg/*"
        token: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
